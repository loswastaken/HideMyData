name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - run: brew install swiftlint xcodegen

      - name: Verify generated Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- HideMyData.xcodeproj

      - name: Lint
        run: swiftlint --strict

      # MLX (via OpenMedKit) compiles Metal shaders; the toolchain is a separate Xcode component.
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build and test (ad-hoc signed, no team required)
        run: xcodebuild -project HideMyData.xcodeproj -scheme HideMyData -configuration Debug -derivedDataPath build/DerivedData test
